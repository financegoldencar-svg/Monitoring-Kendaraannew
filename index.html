<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistem Monitoring Kendaraan</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>window.addEventListener('load',()=>{if(!window.XLSX){const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';document.head.appendChild(s)}});</script>
<style>
:root{--navy:#14264d;--blue:#2457c5;--bg:#f3f6fb;--line:#d9e1ee;--ink:#172033;--muted:#64748b;--green:#15803d;--red:#b91c1c;--amber:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#14264d,#2457c5);color:#fff;padding:20px 24px}header h1{margin:0 0 5px;font-size:22px}header p{margin:0;color:#dbeafe}.layout{display:flex;min-height:calc(100vh - 78px)}nav{width:235px;background:#fff;border-right:1px solid var(--line);padding:12px;flex-shrink:0}nav button{display:block;width:100%;border:0;text-align:left;background:none;padding:10px;border-radius:8px;margin:2px 0;color:#334155;font-weight:bold;cursor:pointer}nav button.active,nav button:hover{background:#eaf1ff;color:var(--blue)}main{padding:22px;min-width:0;flex:1}.page{display:none}.page.active{display:block}.page h2{margin:0 0 15px;font-size:21px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px;margin-bottom:14px}.card small{color:var(--muted)}.card strong{display:block;font-size:19px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field label{display:block;font-size:12px;font-weight:bold;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;background:white}.field textarea{min-height:60px}.full{grid-column:1/-1}.btn{border:0;border-radius:7px;background:var(--blue);color:white;padding:9px 13px;font-weight:bold;cursor:pointer}.btn.alt{background:#e2e8f0;color:#1e293b}.btn.green{background:var(--green)}.btn.red{background:#fee2e2;color:#991b1b}.btn.amber{background:#fef3c7;color:#92400e}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px;margin-bottom:12px}.toolbar .field{min-width:145px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:white}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#edf2f9;color:#334155;font-weight:700;position:sticky;top:0}tbody tr:nth-child(even){background:#fafcff}tbody tr:hover{background:#eef5ff}tfoot th,tfoot td{background:#e8eef8;font-weight:700;border-top:2px solid #b8c7dc}td.r,th.r{text-align:right}.muted,.small{color:var(--muted)}.small{font-size:11px}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:10px;border-radius:8px;margin-bottom:12px}.pill{border-radius:20px;background:#dcfce7;color:#166534;padding:3px 8px;font-size:11px}.pill.warn{background:#fef3c7;color:#92400e}.pill.info{background:#dbeafe;color:#1e40af}.hidden{display:none!important}.section-title{font-weight:bold;margin:16px 0 8px;color:#1e3a8a}.positive{color:var(--green)}.negative{color:var(--red)}@media(max-width:760px){.layout{display:block}nav{width:100%;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{min-width:max-content}main{padding:12px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}@media print{header,nav,.no-print{display:none!important}.layout,main{display:block;padding:0}.page{display:none!important}.page.active{display:block!important}.panel{border:0}body{background:#fff}@page{size:A4 landscape;margin:10mm}}
.card{border-radius:14px;box-shadow:0 4px 18px rgba(20,45,80,.08);border:1px solid #e5eaf1;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,45,80,.12)}.panel{border-radius:16px;border:1px solid #e5eaf1;box-shadow:0 3px 16px rgba(20,45,80,.045)}table thead th{background:#1f4e78;color:white;letter-spacing:.2px}table tbody tr:nth-child(even){background:#f6f9fc}button.btn{border-radius:9px;box-shadow:0 2px 7px rgba(0,0,0,.08)}</head><body>
<header><h1>SISTEM MONITORING KENDARAAN</h1><p>Data Kendaraan • Outstanding • Pembayaran OR • Biaya • Margin Mingguan & Bulanan</p></header>
<div class="layout"><nav class="no-print" id="nav"><button class="active" data-p="dashboard">▦ Dashboard</button><button data-p="kendaraan">🚘 Data Kendaraan</button><button data-p="outstanding">◷ Data Outstanding</button><button data-p="or">◷ Outstanding OR</button><button data-p="lunas">✓ Pembayaran Invoice & OR Lunas</button><button data-p="margin">▤ Laporan Margin</button><button data-p="pembelian">🧾 Pembelian & Supplier</button><button data-p="import">⇧ Import / Export Excel</button><button data-p="backup">⚙ Backup Data</button></nav><main>
<section id="dashboard" class="page active"><h2>Dashboard Monitoring Kendaraan</h2><div class="panel"><h3>Monitoring Outstanding Kendaraan</h3><p class="small muted">Filter tanggal ini hanya memengaruhi data Outstanding (OS Proses, OS Pending Dokumen, OS Invoice, OS Pribadi, dan OS OR).</p><div class="toolbar no-print"><div class="field"><label>Outstanding - Dari tanggal masuk</label><input type="date" id="dashStart"></div><div class="field"><label>Outstanding - Sampai tanggal masuk</label><input type="date" id="dashEnd"></div><button class="btn" onclick="renderDash()">Tampilkan Outstanding</button><button class="btn alt" onclick="clearDash()">Semua tanggal Outstanding</button></div><div class="cards" id="dashCards"></div><h3>Rekap Outstanding per Status</h3><div class="tablewrap"><table><thead><tr><th>Status</th><th class="r">Jumlah Kendaraan</th><th class="r">Total Nilai</th></tr></thead><tbody id="dashStatusRows"></tbody></table></div><div class="actions no-print"><button class="btn alt" onclick="printReport('dashboard')">Cetak Dashboard / PDF</button><button class="btn alt" onclick="printReport('OS Proses')">PDF OS Proses</button><button class="btn alt" onclick="printReport('OS Pending Dokumen')">PDF OS Pending Dokumen</button><button class="btn alt" onclick="printReport('OS Invoice')">PDF OS Invoice</button><button class="btn alt" onclick="printReport('OS Pribadi')">PDF OS Pribadi</button><button class="btn alt" onclick="printReport('OS OR')">PDF OS OR</button></div><div id="statusSummary"></div></div><div class="panel"><h3>Ringkasan Margin</h3><p class="small muted">Filter tanggal ini berdiri sendiri dan hanya memengaruhi Ringkasan Margin di bawah; tidak mengubah angka Outstanding.</p><div class="toolbar no-print"><div class="field"><label>Margin - Dari tanggal masuk</label><input type="date" id="marginDashStart"></div><div class="field"><label>Margin - Sampai tanggal masuk</label><input type="date" id="marginDashEnd"></div><button class="btn" onclick="renderDash()">Tampilkan Margin</button><button class="btn alt" onclick="clearMarginDash()">Semua tanggal Margin</button></div><div class="cards" id="marginCards"></div></div></section>
<section id="kendaraan" class="page"><h2>Data Kendaraan</h2><div class="notice">Isi data kendaraan dan biaya pada satu formulir. Status OS dihitung otomatis. Pembayaran DP dan pembayaran invoice diakumulasikan sebagai pembayaran invoice untuk mengurangi sisa OS Invoice.</div><div class="panel"><form id="vehicleForm"><input type="hidden" id="editId"><div class="section-title">Identitas Kendaraan & Klaim</div><div class="grid"><div class="field"><label>No. Polisi *</label><input id="plate" required placeholder="B 1234 ABC"></div><div class="field"><label>Nama Customer</label><input id="customer"></div><div class="field"><label>Sumber Bisnis</label><select id="vehicleType" onchange="toggleInsurer()"><option value="Asuransi">Asuransi</option><option value="PRIBADI">PRIBADI</option></select></div><div class="field hidden" id="insurerField"><label>Nama Asuransi</label><input id="insurerName" placeholder="Masukkan nama asuransi"></div><div class="field"><label>Jenis / Tipe Kendaraan</label><input id="vehicleName" placeholder="Avanza, Xenia, dll"></div><div class="field"><label>No. Klaim</label><input id="spkNo"></div><div class="field"><label>Nilai SPK (Rp)</label><input id="spkValue" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Tanggal Masuk</label><input id="entryDate" type="date"></div><div class="field"><label>Tanggal Keluar Kendaraan</label><input id="exitDate" type="date"></div><div class="field"><label>No. Invoice</label><input id="invoiceNo"></div><div class="field"><label>Tanggal Kirim Invoice</label><input id="invoiceDate" type="date"></div><div class="field"><label>Nilai Invoice (Rp)</label><input id="invoiceValue" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Tanggal Pembayaran DP</label><input id="dpPayDate" type="date"></div><div class="field"><label>Total Pembayaran DP (Rp)</label><input id="dpPaid" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Tanggal Pembayaran Invoice</label><input id="invoicePayDate" type="date"></div><div class="field"><label>Total Pembayaran Invoice (Rp)</label><input id="invoicePaid" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Nilai OR (Rp)</label><input id="orValue" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Tanggal Pembayaran OR</label><input id="orPayDate" type="date"></div><div class="field"><label>Total Pembayaran OR (Rp)</label><input id="orPaid" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Pot. Salvage (Rp)</label><input id="potSalvage" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Pot. PPh (Rp)</label><input id="potPPh" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Pot. Admin (Rp)</label><input id="potAdmin" type="number" min="0" step="0.01" value="0"></div></div>
<div class="section-title">Rincian Biaya Kendaraan (Rp)</div><div class="grid"><div class="field"><label>Jasa Tukang Sudah Dibayar</label><input id="laborPaid" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Jasa Tukang Belum Dibayar</label><input id="laborUnpaid" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Jasa Tukang Luar GC</label><input id="laborExternal" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Sparepart</label><input id="sparepart" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Bahan</label><input id="material" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Cashback</label><input id="cashback" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Cashback OR (Rp)</label><input id="cashbackOR" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Transport</label><input id="transport" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Keterangan</label><input id="notes" placeholder="Catatan tambahan"></div></div><div class="actions"><button class="btn" type="submit">Simpan Data Kendaraan</button><button class="btn alt" type="button" onclick="resetForm()">Form Baru</button></div></form></div>
<div class="panel"><div class="toolbar"><div class="field"><label>Cari kendaraan / customer / No. Klaim</label><input id="vehicleSearch" oninput="renderVehicles()" placeholder="Ketik pencarian..."></div><div class="field"><label>Status</label><select id="vehicleFilter" onchange="renderVehicles()"><option value="">Semua status</option><option>OS Proses</option><option>OS Pending Dokumen</option><option>OS Invoice</option><option>OS Pribadi</option></select></div><button class="btn alt" onclick="print()">Cetak</button></div><div class="tablewrap"><table><thead><tr><th>No Polisi</th><th>Customer</th><th>Jenis</th><th>Tgl Masuk</th><th>Tgl Keluar</th><th>No. Klaim</th><th>No Invoice</th><th>Status</th><th>Invoice</th><th>Margin</th><th>Margin %</th><th>Aksi</th></tr></thead><tbody id="vehicleRows"></tbody></table></div></div></section>
<section id="outstanding" class="page"><h2>Data Outstanding</h2><div class="panel no-print"><div class="toolbar"><div class="field"><label>Periode</label><select id="osPeriod" onchange="renderOutstanding()"><option value="all">Semua</option><option value="week">Minggu berjalan</option><option value="month">Bulan berjalan</option><option value="custom">Pilih rentang tanggal masuk</option></select></div><div class="field"><label>Dari</label><input type="date" id="osStart" onchange="renderOutstanding()"></div><div class="field"><label>Sampai</label><input type="date" id="osEnd" onchange="renderOutstanding()"></div><div class="field"><label>Status OS</label><select id="osStatus" onchange="renderOutstanding()"><option value="">Semua OS</option><option>OS Proses</option><option>OS Pending Dokumen</option><option>OS Invoice</option><option>OS Pribadi</option></select></div><button class="btn alt" onclick="print()">Cetak / PDF</button></div></div><div class="toolbar no-print"><div class="field"><label>Cari Plat Nomor</label><input id="osPlateSearch" oninput="renderOutstanding()" placeholder="Plat kendaraan"></div></div><div class="cards" id="osCards"></div><div class="panel"><h3>Rekap OS Invoice per Asuransi</h3><div class="toolbar no-print"><div class="field"><label>Pilih Asuransi</label><select id="osInsurerFilter" onchange="renderInsurerOS()"><option value="">Semua Asuransi</option></select></div><button class="btn alt" onclick="exportInsurerOS()">Export Rekap Excel</button></div><div id="osInsurerSummary"></div><div class="tablewrap"><table><thead><tr><th>Nama Asuransi</th><th>Jumlah Kendaraan OS Invoice</th><th class="r">Total Nilai OS Invoice</th><th>Aksi</th></tr></thead><tbody id="osInsurerRows"></tbody></table></div><div id="osInsurerDetail"></div></div><div class="tablewrap"><table><thead><tr><th>No Polisi</th><th>Customer</th><th>Nama Asuransi</th><th>No. Klaim</th><th>Tanggal Masuk</th><th>Tanggal Keluar</th><th>No Invoice</th><th>Tgl Invoice</th><th>Status OS</th><th class="r">Nilai SPK</th><th class="r">Nilai Invoice</th><th class="r">Nilai OS</th><th>Aksi</th></tr></thead><tbody id="osRows"></tbody></table></div></section>
<section id="or" class="page"><h2>Outstanding OR</h2><div class="notice">Nilai OS Invoice = Sisa Invoice - Nilai OR - Cashback OR - Pot. Salvage - Pot. PPh - Pot. Admin. Sisa OS OR per kendaraan = Nilai OR dikurangi Total Pembayaran OR. Jika tanggal dan total pembayaran OR telah diisi hingga lunas, kendaraan tidak lagi dihitung sebagai OS OR.</div><div class="panel no-print"><div class="toolbar"><div class="field"><label>Periode tanggal masuk</label><select id="orPeriod" onchange="renderOR()"><option value="all">Semua</option><option value="week">Minggu berjalan</option><option value="month">Bulan berjalan</option><option value="custom">Pilih rentang</option></select></div><div class="field"><label>Dari</label><input type="date" id="orStart" onchange="renderOR()"></div><div class="field"><label>Sampai</label><input type="date" id="orEnd" onchange="renderOR()"></div><button class="btn alt" onclick="print()">Cetak / PDF</button></div></div><div class="toolbar no-print"><div class="field"><label>Cari Plat Nomor</label><input id="orPlateSearch" oninput="renderOR()" placeholder="Plat kendaraan"></div></div><div class="cards" id="orCards"></div><div class="tablewrap"><table><thead><tr><th>No Polisi</th><th>Customer</th><th>Tgl Masuk</th><th>Status Kendaraan</th><th class="r">Nilai OR</th><th>Tgl Bayar OR</th><th class="r">Dibayar</th><th class="r">Sisa OS OR</th><th>Aksi</th></tr></thead><tbody id="orRows"></tbody></table></div></section>
<section id="lunas" class="page"><h2>Data Pembayaran Invoice dan OR Lunas per Kendaraan</h2><div class="notice">Kendaraan otomatis tampil di sini apabila Nilai OS = Rp 0 (setelah OR, Cashback OR, dan potongan) serta sisa Nilai OR = Rp 0. Data kendaraan tetap tersimpan dan tidak dihapus.</div><div class="toolbar no-print"><div class="field"><label>Cari Plat Nomor</label><input id="lunasPlateSearch" oninput="renderLunas()" placeholder="Plat kendaraan"></div></div><div class="cards" id="lunasCards"></div><div class="tablewrap"><table><thead><tr><th>No Polisi</th><th>Customer</th><th>Nama Asuransi</th><th>No Invoice</th><th>Tgl Bayar DP</th><th class="r">Total DP</th><th>Tgl Bayar Invoice</th><th class="r">Total Pembayaran Invoice</th><th class="r">Total DP + Invoice</th><th class="r">Nilai Invoice Awal</th><th>Tgl Bayar OR</th><th class="r">Total Pembayaran OR</th><th class="r">Nilai OR</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="lunasRows"></tbody></table></div><div class="actions no-print"><button class="btn alt" onclick="print()">Cetak / PDF</button><button class="btn green" onclick="exportLunas()">Export Excel</button></div></section><section id="margin" class="page"><h2>Laporan Margin per Kendaraan</h2><div class="panel no-print"><div class="toolbar"><div class="field"><label>Periode laporan</label><select id="marginPeriod" onchange="renderMargin()"><option value="month">Bulanan</option><option value="week">Mingguan</option><option value="custom">Rentang tanggal</option><option value="all">Semua data</option></select></div><div class="field"><label>Bulan</label><input type="month" id="marginMonth" onchange="renderMargin()"></div><div class="field"><label>Tanggal acuan minggu</label><input type="date" id="marginWeek" onchange="renderMargin()"></div><div class="field"><label>Dari tanggal</label><input type="date" id="marginStart" onchange="renderMargin()"></div><div class="field"><label>Sampai tanggal</label><input type="date" id="marginEnd" onchange="renderMargin()"></div><div class="field"><label>Pilih kendaraan</label><select id="marginVehicle" onchange="renderMargin()"><option value="">Semua kendaraan</option></select></div><button class="btn" onclick="renderMargin()">Tampilkan</button><button class="btn alt" onclick="print()">Cetak / PDF</button><button class="btn alt" onclick="exportMargin()">Export Excel</button></div></div><div class="toolbar no-print"><div class="field"><label>Cari Plat Nomor</label><input id="marginPlateSearch" oninput="renderMargin()" placeholder="Plat kendaraan"></div></div><div class="cards" id="marginSummary"></div><div class="tablewrap"><table><thead><tr><th>No Polisi</th><th>Customer</th><th>Periode</th><th class="r">Nilai SPK</th><th class="r">Nilai Invoice</th><th class="r">Nilai OR</th><th class="r">Jasa Dibayar</th><th class="r">Jasa Belum Dibayar</th><th class="r">Jasa Luar GC</th><th class="r">Sparepart</th><th class="r">Bahan</th><th class="r">Cashback</th><th class="r">Cashback OR</th><th class="r">Transport</th><th class="r">Total Biaya</th><th class="r">Nilai Margin</th><th class="r">Margin %</th><th>Aksi</th></tr></thead><tbody id="marginRows"></tbody><tfoot id="marginFoot"></tfoot></table></div><p class="small muted">Rumus: Total Biaya = seluruh komponen biaya. Nilai Margin = Nilai Invoice + Nilai OR − Total Biaya. Margin % = Nilai Margin ÷ (Nilai SPK + Nilai OR) × 100%.</p></section>
<section id="import" class="page"><h2>Import / Export Excel</h2><div class="notice">Import Excel membaca judul kolom yang dikenal meskipun ada baris judul tambahan, variasi penulisan, atau format tanggal/angka Excel. Baris dengan No Polisi yang sama akan memperbarui data kendaraan tersebut; No Polisi baru akan ditambahkan.</div><div class="panel"><h3>1. Download Template Excel</h3><p class="small">Template berisi nama kolom yang dikenali sistem. Isi data sesuai kolom, lalu unggah kembali.</p><button class="btn green" onclick="downloadTemplate()">Download Template Excel</button></div><div class="panel"><h3>2. Upload Data Excel</h3><div class="field"><label>Pilih file Excel (.xlsx, .xls) atau CSV</label><input type="file" id="excelFile" accept=".xlsx,.xls,.csv"></div><div class="actions"><button class="btn" onclick="importExcel()">Import Data</button></div><p id="importResult" class="small muted"></p></div><div class="panel"><h3>3. Export Data Kendaraan</h3><button class="btn alt" onclick="exportVehicles()">Export Data Kendaraan</button> <button class="btn green" onclick="exportAllData()">Export Semua Data Aplikasi (Kendaraan, Margin, Pembelian & Supplier)</button> <button class="btn" onclick="downloadShareableApp()">Buat File Aplikasi + Data untuk WhatsApp</button><p class="small muted">Kirim file HTML yang diunduh melalui WhatsApp sebagai Dokumen. Penerima dapat membuka aplikasi beserta data yang disertakan.</p></div></section>
<section id="pembelian" class="page"><h2>Pembelian Bahan, Sparepart & Jasa Tukang Luar</h2><div class="notice">Setiap transaksi otomatis ditautkan ke kendaraan berdasarkan No. Polisi dan menambah kategori biaya yang sesuai pada Laporan Margin. Contoh: Bahan cat untuk B 1287 BK akan menambah kolom Bahan kendaraan B 1287 BK. Edit atau hapus transaksi akan menghitung ulang nilai kategori.</div>
<div class="panel"><h3>Input Transaksi Pembelian</h3><form id="purchaseForm"><input type="hidden" id="purchaseEditId"><div class="grid"><div class="field"><label>Tanggal Transaksi *</label><input type="date" id="purchaseDate" required></div><div class="field"><label>No. Polisi / Kendaraan *</label><select id="purchasePlate" required><option value="">Pilih kendaraan</option></select></div><div class="field"><label>Kategori Biaya *</label><select id="purchaseCategory" required><option value="material">Bahan</option><option value="sparepart">Sparepart</option><option value="laborExternal">Jasa Tukang Luar GC</option></select></div><div class="field"><label>Nama Supplier / Vendor *</label><input id="purchaseSupplier" list="supplierOptions" placeholder="Pilih atau ketik supplier" required><datalist id="supplierOptions"></datalist></div><div class="field"><label>Nama Barang / Jasa *</label><input id="purchaseItem" required placeholder="Contoh: Cat, thinner, bumper, jasa ketok"></div><div class="field"><label>Qty</label><input id="purchaseQty" type="number" min="0" step="0.01" value="1"></div><div class="field"><label>Harga Satuan (Rp)</label><input id="purchasePrice" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Total Pembelian (Rp) *</label><input id="purchaseAmount" type="number" min="0" step="0.01" value="0" required></div><div class="field full"><label>Keterangan</label><input id="purchaseNotes" placeholder="Nomor nota / catatan tambahan"></div>
<div class="field"><label>Foto Nota Pembelian</label><input type="file" id="purchaseReceiptPhoto" accept="image/*"></div>
<div class="field"><label>Foto Bukti Pembayaran</label><input type="file" id="purchasePaymentPhoto" accept="image/*"></div>
<div class="field full"><p class="small muted">Foto akan disimpan bersama transaksi. Gunakan gambar JPG/PNG; gambar akan diperkecil otomatis agar penyimpanan browser tidak cepat penuh.</p><div id="purchasePhotoPreview" class="small"></div></div>
</div><div class="actions"><button class="btn" type="submit">Simpan Transaksi</button><button class="btn alt" type="button" onclick="resetPurchaseForm()">Form Baru</button></div></form></div>
<div class="panel"><h3>Master Supplier / Vendor</h3><input type="hidden" id="supplierEditId"><div class="grid"><div class="field"><label>Nama Supplier *</label><input id="supplierName" placeholder="Nama toko / supplier"></div><div class="field"><label>No. Telepon</label><input id="supplierPhone" placeholder="Nomor telepon"></div><div class="field"><label>Alamat</label><input id="supplierAddress" placeholder="Alamat supplier"></div></div><div class="actions"><button class="btn green" onclick="addSupplier()" id="supplierSaveBtn">Tambah Supplier</button> <button class="btn alt" onclick="resetSupplierForm()" type="button">Form Baru</button></div><div class="tablewrap"><table><thead><tr><th>Nama Supplier</th><th>Telepon</th><th>Alamat</th><th>Aksi</th></tr></thead><tbody id="supplierRows"></tbody></table></div></div>

(m)],['Margin %',pct.toFixed(2)+'%']].map(a=>`<div class="card"><small>${a[0]}</small><strong>${a[1]}</strong></div>`).join('')}

function importExcel(){let f=$('excelFile').files[0];if(!f)return alert('Pilih file Excel terlebih dahulu.');if(!window.XLSX)return alert('Library Excel belum termuat. Periksa koneksi internet.');let r=new FileReader();r.onload=ev=>{try{let wb=XLSX.read(ev.target.result,{type:'array',cellDates:true}),count=0,updated=0,purchaseCount=0,supplierCount=0,recognized=false;const numeric=['spkValue','invoiceValue','invoicePaid','dpPaid','orValue','orPaid','potSalvage','potPPh','potAdmin','laborPaid','laborUnpaid','laborExternal','sparepart','material','cashback','cashbackOR','transport'];wb.SheetNames.forEach(sheetName=>{let sn=normalize(sheetName),rows=sheetRows(wb.Sheets[sheetName]);if(!rows.length)return;if(sn.includes('pembelian')||sn.includes('transaksi')){recognized=true;rows.forEach(row=>{let plate=String(valueFrom(row,'No Polisi','Plat Nomor','Kendaraan','plate')).trim().toUpperCase();if(!plate)return;let cat=String(valueFrom(row,'Kategori','Kategori Biaya')||'Bahan').toLowerCase(),item={date:parseDate(valueFrom(row,'Tanggal','Tanggal Transaksi','date')),plate,category:cat.includes('spare')?'sparepart':cat.includes('jasa')?'laborExternal':'material',supplier:String(valueFrom(row,'Supplier','Nama Supplier','Vendor')),item:String(valueFrom(row,'Barang/Jasa','Nama Barang','Item')),qty:cleanNumber(valueFrom(row,'Qty','Jumlah'))||1,price:cleanNumber(valueFrom(row,'Harga Satuan','Harga')),amount:cleanNumber(valueFrom(row,'Total','Total Pembelian','Jumlah Total')),notes:String(valueFrom(row,'Keterangan','Catatan'))};let old=db.purchases.find(x=>x.date===item.date&&x.plate===item.plate&&x.item===item.item&&x.supplier===item.supplier);if(old)Object.assign(old,item);else db.purchases.push({id:crypto.randomUUID(),...item});purchaseCount++});return}if(sn.includes('supplier')){recognized=true;rows.forEach(row=>{let name=String(valueFrom(row,'Nama Supplier','Supplier','Nama','name')).trim();if(!name)return;let old=db.suppliers.find(x=>x.name.toLowerCase()===name.toLowerCase()),it
